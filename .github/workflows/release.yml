name: Release

# Pushing a v<VERSION> tag builds the four daemon binaries on native runners,
# builds and pushes the amd64 and arm64 images (each with all daemon binaries)
# and a multi-arch manifest to GHCR, then creates the GitHub Release.

on:
  push:
    tags: ['v*']

# Jobs request write access only where they need it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag must equal v$(cat VERSION)
        run: |
          version=$(scripts/check-release-version.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case $version in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  daemon:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            optional: false
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            optional: false
          - target: macos-arm64
            runner: macos-15
            optional: false
          # Intel macOS runners are being retired: this target may be missing
          # from a release (the release notes say so).
          - target: macos-x64
            runner: macos-15-intel
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      # OTP (built from source by scripts/build-erts.sh), Elixir and zig come
      # from scripts/build-daemon.sh; Linux builds run in daemon/build/Dockerfile.
      - name: Cache the self-built OTP
        uses: actions/cache@v4
        with:
          path: ~/.cache/helmsman-build/erts
          key: daemon-erts-${{ matrix.target }}-${{ hashFiles('.tool-versions', 'scripts/build-erts.sh', 'daemon/build/Dockerfile') }}
      - name: Cache Elixir and zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/helmsman-build/tools
          key: daemon-tools-${{ matrix.target }}-${{ hashFiles('.tool-versions', 'scripts/build-tools.sh') }}
      - name: Install xz
        if: runner.os == 'macOS'
        run: command -v xz >/dev/null || brew install xz
      - name: Build helmsman-${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-daemon.sh "$TARGET" dist
      - name: Smoke-test helmsman-${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          SMOKE_IMAGES: ${{ runner.os == 'Linux' && 'debian:bullseye ubuntu:24.04' || '' }}
        run: scripts/smoke-daemon-binary.sh "dist/helmsman-$TARGET" "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: helmsman-${{ matrix.target }}
          path: |
            dist/helmsman-${{ matrix.target }}
            dist/helmsman-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [check, daemon]
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: helmsman-*
          path: daemon-dist
          merge-multiple: true
      - name: Check the daemon binaries
        run: |
          ls -l daemon-dist
          cd daemon-dist && sha256sum -c ./*.sha256
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/helmsman"
          docker build --build-arg DAEMON_DIST=daemon-dist \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$VERSION-$ARCH" .
          docker push "$image:$VERSION-$ARCH"

  image-manifest:
    needs: [check, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/helmsman"
          set -- -t "$image:$VERSION"
          # Pre-release versions (with a "-") never move :latest.
          if [ "$PRERELEASE" = false ]; then set -- "$@" -t "$image:latest"; fi
          docker buildx imagetools create "$@" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"

  github-release:
    needs: [check, daemon, image-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: helmsman-*
          path: dist
          merge-multiple: true
      - name: Combine checksums and write the notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          cat ./*.sha256 | sort -k 2 > SHA256SUMS
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/helmsman"
          {
            echo "Server image: \`$image:$VERSION\` (linux/amd64, linux/arm64)."
            echo
            echo "Daemon: \`curl -fsSL https://<your server>/install.sh | sh\`, or download a binary below and check it against SHA256SUMS."
            for target in linux-x64 linux-arm64 macos-x64 macos-arm64; do
              if [ ! -f "helmsman-$target" ]; then
                echo
                echo "Note: no $target binary in this release (its build runner was unavailable)."
              fi
            done
          } > ../release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -- --repo "$GITHUB_REPOSITORY" --title "Helmsman $VERSION" --notes-file release-notes.md --verify-tag
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          gh release create "$GITHUB_REF_NAME" "$@" dist/*
